# FitFood PK 后端 Nginx 反向代理配置
# 适用于：Ubuntu/Debian /etc/nginx/sites-available/fitfoodpk.conf
# CentOS/Alibaba Cloud Linux /etc/nginx/conf.d/fitfoodpk.conf

# ── 灰度发布：按 Cookie 中的 canary_group 分流 ──
# 设置 Cookie：canary_group=beta （走新版），否则走稳定版
map $cookie_canary_group $backend {
    beta    http://127.0.0.1:8001;   # 灰度实例（新版）
    default http://127.0.0.1:8000;   # 稳定实例
}

server {
    listen 80;
    server_name rubyace.love;

    # 上传大小限制（贴纸图片可能较大）
    client_max_body_size 50m;
    proxy_read_timeout 120s;

    # ── 贴纸静态文件走 CDN 源站路径（供 CDN 回源） ──
    location /stickers/ {
        alias /opt/fitfoodpk/server/stickers/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ── 健康检查端点（不记录日志） ──
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # ── API 请求：前端统一请求同源 /api/*，此处剥离 /api 前缀转发到后端 ──
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff;
    }

    # ── 前端静态资源（SPA）：由前端构建产物 dist/ 提供，API 已走 /api/ ──
    # 部署前端：将前端 pnpm build 产物 dist/ 放到 /opt/fitfoodpk/frontend/dist
    root /opt/fitfoodpk/frontend/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
    }
}

# ── HTTPS：安装 certbot 并运行以下命令后自动生成 ──
# certbot --nginx -d rubyace.love
