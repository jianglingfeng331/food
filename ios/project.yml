# XcodeGen 工程描述文件
# 用法：
#   brew install xcodegen
#   cd food-sticker-app/ios
#   xcodegen generate
# 生成标准 FoodStickerApp.xcodeproj 后，用 Xcode 打开、配签名、Run 真机。

name: FoodStickerApp
options:
  bundleIdPrefix: com.rubyace
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # 源码都用原生框架（AVFoundation / Photos / SQLite3 / CoreImage / CoreML 由 .mlpackage 自动桥接），
  # 因此本工程不依赖任何 SwiftPM / CocoaPods 三方包。
packages: {}

targets:
  FoodStickerApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    # 递归包含整个 FoodSticker 目录（源文件 + 资源 + storyboard + xcassets）
    sources:
      - path: FoodSticker
        excludes:
          - "**/.DS_Store"
    # 内联生成 Info.plist（相机/相册权限 + ATS 强制 HTTPS + Scene 入口）
    info:
      properties:
        UILaunchStoryboardName: LaunchScreen
        UISceneConfigurations:
          UIWindowSceneSessionRoleApplication:
            - UISceneConfigurationName: "Default Configuration"
              UISceneDelegateClassName: SceneDelegate
        NSCameraUsageDescription: "用于拍摄食物并生成卡通贴纸"
        NSPhotoLibraryAddUsageDescription: "用于将生成的贴纸保存到相册"
        NSPhotoLibraryUsageDescription: "用于从相册选择照片进行贴纸生成"
        # 打包的自定义字体（PostScript 名见 FoodSticker/AppFont.swift）
        UIAppFonts:
          - SourceSerif4-Regular.ttf
          - SourceSerif4-Semibold.ttf
          - SourceSerif4-Bold.ttf
          - Inter-Variable.ttf
          - NotoSansSC-Variable.ttf
          - NotoSerifSC-Regular.ttf
          - NotoSerifSC-Bold.ttf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false   # 云端必须 HTTPS，禁止明文
        UIBackgroundModes: []             # 不需要后台能力
        CFBundleDisplayName: "FitFood PK"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubyace.fitfoodpk
        PRODUCT_NAME: "$(TARGET_NAME)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "4JP57RB9WM"
        ENABLE_BITCODE: false
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"     # 仅 iPhone
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 资源：营养库（nutrition.db），可选端侧抠图模型 MobileSAMEncoder/Decoder.mlpackage（占位中）。
        # 主流程 AI 均走云端，详见 README 架构说明。
        COPY_PHASE_STRIP: false
